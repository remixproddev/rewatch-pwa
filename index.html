<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rewatch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #ios-prompt { display: none; position: fixed; bottom: 24px; left: 16px; right: 16px; background: rgba(255, 255, 255, 0.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 16px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 9999; border: 1px solid rgba(0,0,0,0.05); box-sizing: border-box; }
    .banner-container { display: flex; align-items: center; }
    .banner-icon { width: 44px; height: 44px; border-radius: 10px; margin-right: 12px; object-fit: cover; }
    .banner-text { flex-grow: 1; }
    .banner-title { font-size: 15px; font-weight: 600; color: #111111; margin: 0; }
    .banner-subtitle { margin: 4px 0 0 0; font-size: 13px; color: #555555; line-height: 1.4; }
    .share-icon-svg { vertical-align: middle; width: 16px; height: 16px; margin: 0 2px; }
    .close-button { background: none; border: none; font-size: 22px; color: #999999; padding: 4px 8px; cursor: pointer; line-height: 1; }
  </style>
</head>
<body>
  <div id="ios-prompt">
    <div class="banner-container">
      <img src="icon-512.png" class="banner-icon" alt="App Icon">
      <div class="banner-text">
        <p class="banner-title">Install Rewatch</p>
        <p class="banner-subtitle">Tap the share icon <svg class="share-icon-svg" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg> below, then select <b>Add to Home Screen</b>.</p>
      </div>
      <button class="close-button" onclick="document.getElementById('ios-prompt').style.display='none'">&times;</button>
    </div>
  </div>

  <!-- Your Live Custom Embedded App Frame Link -->
  <iframe src="https://www.remixrewatch.com"></iframe>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }
    const isRunningStandalone = window.matchMedia('(display-mode: standalone)').matches;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    if (isIOS && !isRunningStandalone) { document.getElementById('ios-prompt').style.display = 'block'; }
  </script>
</body>
</html>
